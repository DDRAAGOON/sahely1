name: sahely
description: "Sahely — Verified Chalets. Zero Chaos. Luxury North-Coast property rental app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^8.1.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  intl: ^0.20.2
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0
  gal: ^2.3.2
  http: ^1.2.1
  path_provider: ^2.1.3
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  shared_preferences: ^2.2.2
  get_it: ^7.6.4
  flutter_secure_storage: ^10.3.1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  go_router: ^17.3.0
  table_calendar: ^3.2.0
  provider: ^6.1.5+1
  share_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#1B2744"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    background_color: "#1B2744"
    theme_color: "#1B2744"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/placeholder_property.png
    - assets/images/onboarding_1.png
    - assets/images/onboarding_2.png
    - assets/images/onboarding_3.png
    - assets/images/google_logo.png
