plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release keystore credentials live in android/key.properties (NOT committed).
// See key.properties.example for the expected format.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.sahely.sahely"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }

    defaultConfig {
        applicationId = "com.sahely.sahely"
        minSdkVersion = 24
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // The Maps key is injected at build time so it never sits in the
        // manifest in source control. Supply it via android/key.properties
        // (googleMapsApiKey=...) or -PGOOGLE_MAPS_API_KEY=... on the CLI.
        manifestPlaceholders += [
            GOOGLE_MAPS_API_KEY: (
                project.findProperty('GOOGLE_MAPS_API_KEY')
                    ?: keystoreProperties.getProperty('googleMapsApiKey')
                    ?: ''
            )
        ]
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Falls back to debug keys only when key.properties is absent
            // (local development). Production builds require a real keystore -
            // the warning below makes an unsigned release impossible to miss.
            if (!keystorePropertiesFile.exists()) {
                logger.warn('*** Sahely: android/key.properties is missing - ' +
                    'this release build is signed with DEBUG keys and must ' +
                    'not be published. See key.properties.example. ***')
            }
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug

            // Shrink and obfuscate. Flutter ships the ProGuard rules its
            // engine needs; the extra file covers our own plugins.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }
    }
}

flutter {
    source = "../.."
}
